<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rummage</title>
  <link rel="icon" href="icons/rummage-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@600;800&family=Funnel+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="page.css">
</head>
<body class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><img class="mark" src="icons/brand-mark.svg" alt=""><span>rummage</span></div>
    <nav id="nav" aria-label="Library"></nav>
    <div class="spacer"></div>
    <div class="sync-card">
      <span class="i i-sync" aria-hidden="true"></span>
      <div><b>Synced with Chrome</b><span id="sync-note">Both ways</span></div>
    </div>
  </aside>

  <main>
    <header class="top">
      <button class="btn btn-quiet btn-round menu-btn" id="menu-btn" type="button" aria-label="Show folders"><span class="i i-library" aria-hidden="true"></span></button>
      <label class="search-field">
        <span class="i i-search" aria-hidden="true"></span>
        <input id="search" type="search" autocomplete="off" aria-label="Search bookmarks">
        <span class="kbd" id="search-kbd" title="Open the command bar"></span>
      </label>
      <button class="btn btn-quiet" id="import-btn" type="button"><span class="i i-import" aria-hidden="true"></span><span class="label-text">Import</span></button>
      <button class="btn btn-primary" id="add-btn" type="button"><span class="i i-plus" aria-hidden="true"></span><span class="label-text">Add link</span></button>
      <button class="btn btn-quiet btn-round" id="settings-btn" type="button" aria-label="Settings"><span class="i i-sliders" aria-hidden="true"></span></button>
      <input id="import-file" type="file" accept=".json,.html,.htm,.csv" hidden>
    </header>
    <div id="view" style="display: contents"></div>
  </main>

  <div class="bulk" id="bulk" hidden>
    <strong id="bulk-count"></strong>
    <select id="bulk-move" aria-label="Move to folder"></select>
    <input id="bulk-tag" placeholder="Add a tag" aria-label="Add a tag to the selected links">
    <button class="btn btn-quiet" id="bulk-group" type="button">Open as tab group</button>
    <button class="btn btn-quiet" id="bulk-export" type="button">Export</button>
    <button class="btn btn-accent" id="bulk-bin" type="button"><span class="i i-trash" aria-hidden="true"></span>Move to bin</button>
    <button class="btn btn-quiet btn-round" id="bulk-clear" type="button" aria-label="Clear selection"><span class="i i-close" aria-hidden="true"></span></button>
  </div>

  <div class="toast" id="toast" role="status" hidden><span id="toast-text"></span><button class="link" id="toast-undo" type="button" hidden>Undo</button></div>

  <script type="module" src="page.js"></script>
</body>
</html>
